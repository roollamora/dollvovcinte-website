<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    /* Tall scroll container to give scroll room */
    #scroll-container {
      height: 500vh;
      width: 100%;
    }

    /* Fixed video wrapper */
    #video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }

    #scroll-video {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    /* Scroll hint overlay */
    #scroll-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      z-index: 100;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    #scroll-hint .arrow {
      display: block;
      font-size: 20px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* Progress bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #fff;
      z-index: 200;
      transition: width 0.05s linear;
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <div id="video-wrapper">
    <video
      id="scroll-video"
      src="Public/WhatsApp Video 2026-02-23 at 13.37.53.mp4"
      preload="metadata"
      muted
      playsinline
    ></video>
  </div>

  <div id="scroll-container"></div>

  <div id="scroll-hint">
    <span class="arrow">↓</span>
    Scroll to play
  </div>

  <script>
    (function () {
      const video = document.getElementById('scroll-video');
      const progressBar = document.getElementById('progress-bar');
      const hint = document.getElementById('scroll-hint');

      let ticking = false;
      let hintHidden = false;

      function getScrollProgress() {
        const scrollY = window.scrollY || window.pageYOffset || 0;
        const docHeight = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight
        );
        const viewportHeight = window.innerHeight;
        const maxScroll = docHeight - viewportHeight;
        if (maxScroll <= 0) return 0;
        return Math.min(Math.max(scrollY / maxScroll, 0), 1);
      }

      function onScroll() {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }

        // Hide hint on first scroll
        if (!hintHidden) {
          hint.style.opacity = '0';
          hintHidden = true;
        }
      }

      function update() {
        if (!video.duration) {
          ticking = false;
          return;
        }

        const progress = getScrollProgress();
        const targetTime = progress * video.duration;

        // Only update if change is meaningful
        if (Math.abs(video.currentTime - targetTime) > 0.01) {
          video.currentTime = targetTime;
        }

        progressBar.style.width = (progress * 100) + '%';
        ticking = false;
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      // Also handle resize
      window.addEventListener('resize', function () {
        requestAnimationFrame(update);
      });

      // Set initial frame when metadata loads
      video.addEventListener('loadedmetadata', function () {
        video.currentTime = 0;
      });

      // Handle load errors gracefully
      video.addEventListener('error', function () {
        document.body.innerHTML = '<div style="color:white;font-family:Arial;text-align:center;padding:40px;"><h2>Video could not be loaded</h2><p style="margin-top:10px;opacity:0.7;">Make sure the <code>Public</code> folder is in the same directory as this HTML file.</p></div>';
      });
    })();
  </script>

</body>
</html>
