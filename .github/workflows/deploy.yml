name: Deploy dollvovcinte.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files
        run: |
          test -f index.html
          test -f scroll-video-player.js
          test -f position-calculator.js
          test -f responsive-manager.js
          test -f Secret-Cellar/index.html
          test -f Secret-Cellar/styles.css
          test -f Secret-Cellar/js/app.js
          test -f Secret-Cellar/js/auth.js
          test -f Secret-Cellar/js/storage.js
          test -f api/auth.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          fi

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          fi

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        id: production
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `**Vercel preview deployed**\n\n${url}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
