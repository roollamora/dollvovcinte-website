name: Secret-Cellar health

# Does not need VERCEL_TOKEN — only checks the live site.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
    paths:
      - "Secret-Cellar/**"
      - "api/auth.js"
      - "scripts/check-secret-cellar.sh"
      - ".github/workflows/secret-cellar-health.yml"

jobs:
  health:
    name: Live Secret-Cellar checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health script
        run: |
          chmod +x scripts/check-secret-cellar.sh
          # Allow brief CDN settle after push
          sleep 15
          ./scripts/check-secret-cellar.sh https://dollvovcinte.com
          ./scripts/check-secret-cellar.sh https://dollvovcinte-website.vercel.app
