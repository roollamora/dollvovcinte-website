<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dollvovcinte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #f5f5f5;
    }

    .hero {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .hero__hue {
      width: 100%;
      height: 100%;
      animation: hue-rotate 16s linear infinite;
    }

    .hero__image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      animation: saturation-pulse 7s ease-in-out infinite;
    }

    @keyframes hue-rotate {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }

    @keyframes saturation-pulse {
      0%, 100% { filter: saturate(0.75); }
      50% { filter: saturate(1.45); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .coming-soon {
      font-family: "Special Elite", "Courier New", Courier, monospace;
      font-size: clamp(1.25rem, 4vw, 2rem);
      letter-spacing: 0.12em;
      text-transform: lowercase;
      text-shadow:
        0 0 24px rgba(0, 0, 0, 0.85),
        0 2px 8px rgba(0, 0, 0, 0.9);
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__hue,
      .hero__image {
        animation: none;
      }

      .hero__image {
        filter: saturate(1);
      }
    }
  </style>
</head>
<body>
  <div class="hero" aria-hidden="true">
    <div class="hero__hue">
      <img
        class="hero__image"
        src="Public/P1140317.png"
        alt=""
        width="1920"
        height="1080"
        decoding="async"
        fetchpriority="high"
      >
    </div>
  </div>

  <main class="overlay">
    <p class="coming-soon">[coming soon]</p>
  </main>
</body>
</html>
